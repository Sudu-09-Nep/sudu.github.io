# Basic Site Settings
locale        : "en-US"
site_theme    : "contrast"   # "default", "air", "sunrise", "mint", "dirt", "contrast"

title         : "Sudarshan's Digital Space"
title_separator : "-"
name          : &name "Sudarshan Aryal"
description   : &description "Undergraduate Bioscience and Biotechnology Student"

url           : "https://sudu-09-nep.github.io"
baseurl       : "/sudu.github.io"
repository    : "Sudu-09-Nep/sudu.github.io"

# Site Author
author:
  name      : "Sudarshan Aryal"
  avatar    : "https://sudu-09-nep.github.io/sudu.github.io/images/bio-photo.jpg"
  pronouns  : "he/his"
  bio       : "Undergraduate Bioscience and Biotechnology Student"
  location  : "Malika Rural Municipality-4-Gulmi, Nepal"
  uri       : "https://sudu-09-nep.github.io/sudu.github.io/"
  email     : "sudarshanaryal99@gmail.com"
  student   : "Sri Sathya Sai Institute of Higher Learning"
  github    : "Sudu-09-Nep"
  linkedin  : "https://www.linkedin.com/in/sudarshan-aryal-94838a2a5/"

# Publication Category
publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

# Site Settings
teaser          :
breadcrumbs     : false
words_per_minute: 160
future          : true
read_more       : "disabled"
talkmap_link    : false

comments:
  provider : 

atom_feed:
  hide : false
  path :

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username : 
facebook:
  username :
  app_id   :
  publisher:
og_image       :
og_description :

social:
  type : 
  name :
  links: 

# Analytics
analytics:
  provider : "false"
  google:
    tracking_id :

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding    : "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown      : kramdown
highlighter   : rouge
lsi           : false
excerpt_separator: "\n\n"
incremental   : false

# Markdown Processing
kramdown:
  input        : GFM
  hard_wrap    : false
  auto_ids     : true
  footnote_nr  : 1
  entity_output: as_char
  toc_levels   : 1..6
  smart_quotes : lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output   : true
    permalink: /:collection/:path/
  publications:
    output   : true
    permalink: /:collection/:path/
  portfolio:
    output   : true
    permalink: /:collection/:path/
  talks:
    output   : true
    permalink: /:collection/:path/
  projects:
    output   : true
    permalink: /:collection/:path/

# Legacy navigation (not used for header now, we use _data/navigation.yml)
navigation:
  - title: "About"
    url  : /about/
  - title: "Projects"
    url  : /projects/
  - title: "Blog Posts"
    url  : /year-archive/
  - title: "Portfolio"
    url  : /portfolio/
  - title: "CV"
    url  : /cv-json/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout       : single
      author_profile: true
      read_time    : true
      comments     : true
      share        : true
      related      : true

  - scope:
      path: ""
      type: pages
    values:
      layout       : single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout       : single
      author_profile: true
      share        : true
      comments     : true

  - scope:
      path: ""
      type: publications
    values:
      layout       : single
      author_profile: true
      share        : true
      comments     : true

  - scope:
      path: ""
      type: portfolio
    values:
      layout       : single
      author_profile: true
      share        : true
      comment      : true

  - scope:
      path: ""
      type: talks
    values:
      layout       : talk
      author_profile: true
      share        : true

# Sass/SCSS
sass:
  sass_dir: _sass
  style  : compressed

# Outputting
permalink : /:categories/:title/
timezone  : Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
