talkmap_link : false
comments:
  provider :
atom_feed:
  hide : false
  path :
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
  - "*.sh"
keep_files:
  - .git
  - .svn
encoding : "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown : kramdown
highlighter : rouge
lsi : false
excerpt_separator: "\n\n"
incremental : false
kramdown:
  input : GFM
  hard_wrap : false
  auto_ids : true
  footnote_nr : 1
  entity_output: as_char
  toc_levels : 1..6
  smart_quotes : lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
collections:
  teaching:
    output : true
    permalink: /:collection/:path/
  publications:
    output : true
    permalink: /:collection/:path/
  portfolio:
    output : true
    permalink: /:collection/:path/
  talks:
    output : true
    permalink: /:collection/:path/
  projects:
    output : true
    permalink: /:collection/:path/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout : post
      author_profile: true
      read_time : true
      comments : true
      share : true
      related : true
  - scope:
      path: ""
      type: pages
    values:
      layout : page
  - scope:
      path: ""
      type: portfolio
    values:
      layout : single
      author_profile: true
  - scope:
      path: ""
      type: projects
    values:
      layout : single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout : single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout : single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout : single
      author_profile: true
sass:
  sass_dir: _sass
  style : compressed
permalink : /:categories/:title/
timezone : Etc/UTC
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
compress_html:
  clippings: all
  ignore:
    envs: development
