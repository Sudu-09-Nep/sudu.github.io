<script>
var nav = document.getElementById('nav');
window.addEventListener('scroll', function() {
  nav.classList.toggle('scrolled', window.scrollY > 20);
});

var sections = document.querySelectorAll('section[id], .section-alt section[id]');
var navLinks = document.querySelectorAll('.nav-links a:not(.nav-cta)');

function setActiveLink() {
  var c = '';
  sections.forEach(function(s) {
    if (window.scrollY >= s.offsetTop - 120) c = s.getAttribute('id');
  });
  navLinks.forEach(function(l) {
    l.classList.remove('active');
    if (l.getAttribute('href').endsWith('#' + c)) l.classList.add('active');
  });
}
window.addEventListener('scroll', setActiveLink);

var mobileToggle = document.getElementById('mobileToggle');
var mobileMenu = document.getElementById('mobileMenu');
var menuOpen = false;

if (mobileToggle) {
  mobileToggle.addEventListener('click', function() {
    menuOpen = !menuOpen;
    mobileMenu.classList.toggle('open', menuOpen);
    mobileToggle.innerHTML = menuOpen ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-bars"></i>';
  });
  mobileMenu.querySelectorAll('a').forEach(function(l) {
    l.addEventListener('click', function() {
      menuOpen = false;
      mobileMenu.classList.remove('open');
      mobileToggle.innerHTML = '<i class="fa-solid fa-bars"></i>';
    });
  });
}

var revealEls = document.querySelectorAll('.reveal');
var revealObs = new IntersectionObserver(function(entries) {
  entries.forEach(function(e) {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      revealObs.unobserve(e.target);
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
revealEls.forEach(function(el) { revealObs.observe(el); });

function showToast(m) {
  var t = document.getElementById('toast');
  if (!t) return;
  document.getElementById('toastMsg').textContent = m;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3500);
}

window.addEventListener('resize', function() {
  if (window.innerWidth > 640 && menuOpen) {
    menuOpen = false;
    mobileMenu.classList.remove('open');
    mobileToggle.innerHTML = '<i class="fa-solid fa-bars"></i>';
  }
});
</script>
